name: F-Situations schema values and latency
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: situations-values-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # The old app is the PR base (the previous main on a push). Main has the
  # admin snapshot pages under the 64 KiB record cap since #28.
  APP_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  APP_AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
  # Both arms run the same prebuilt daemon: the latest lastdb nightly, fetched
  # below. This job compares the old app with the new app on the latest LastDB.
  # Daemon-against-daemon comparisons belong to the lastdb benchmark CI.
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  compare:
    name: Actual app latency
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APP_AFTER }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APP_BEFORE }}
          path: baseline
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Fetch the latest lastdb nightly
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh release list -R EdgeVector/lastdb --exclude-drafts --limit 30 \
            --json tagName,publishedAt --jq '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.publishedAt) | last | .tagName')"
          test -n "$tag" && test "$tag" != null
          dir="$RUNNER_TEMP/lastdb-nightly"
          mkdir -p "$dir"
          gh release download "$tag" -R EdgeVector/lastdb -D "$dir" \
            -p 'lastdb-x86_64-unknown-linux-gnu.tar.gz' -p 'lastdb-x86_64-unknown-linux-gnu.manifest.json' -p SHA256SUMS.txt
          (cd "$dir" && grep ' lastdb-x86_64-unknown-linux-gnu.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
          tar -xzf "$dir/lastdb-x86_64-unknown-linux-gnu.tar.gz" -C "$dir"
          for name in lastdb lastdbd; do
            want="$(jq -r --arg n "$name" '.binaries[] | select(.name == $n) | .sha256' "$dir/lastdb-x86_64-unknown-linux-gnu.manifest.json")"
            test "$(sha256sum "$dir/$name" | cut -d' ' -f1)" = "$want"
          done
          oid="$(jq -r .source_git_oid "$dir/lastdb-x86_64-unknown-linux-gnu.manifest.json")"
          # The daemon reports this build version in /api/version. The latency script checks it.
          version="$(jq -r .version "$dir/lastdb-x86_64-unknown-linux-gnu.manifest.json")"
          test -n "$version" && test "$version" != null
          sum="$(grep ' lastdb-x86_64-unknown-linux-gnu.tar.gz$' "$dir/SHA256SUMS.txt" | cut -d' ' -f1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "lastdbd=$dir/lastdbd" >> "$GITHUB_OUTPUT"
          echo "lastdb=$dir/lastdb" >> "$GITHUB_OUTPUT"
          printf '### LastDB under test\n\nNightly `%s` (source `%s`), Linux tarball sha256 `%s`.\n' "$tag" "$oid" "$sum" >> "$GITHUB_STEP_SUMMARY"
      # The lastdb helper scripts (scripts/benchmarks, scripts/disk_v2) at the
      # nightly source, so the helper and the daemon stay in step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: EdgeVector/lastdb
          ref: ${{ steps.nightly.outputs.oid }}
          path: lastdb
          persist-credentials: false
      - name: Require the actual source revisions
        env:
          NIGHTLY_TAG: ${{ steps.nightly.outputs.tag }}
          NIGHTLY_OID: ${{ steps.nightly.outputs.oid }}
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$APP_AFTER"
          test "$(git -C baseline rev-parse HEAD)" = "$APP_BEFORE"
          test "$(git -C lastdb rev-parse HEAD)" = "$NIGHTLY_OID"
          mkdir "$RUNNER_TEMP/situations-definition-results"
          printf 'App before: %s\nApp after: %s\nDaemon (both arms): %s, source %s, version %s\n' \
            "$APP_BEFORE" "$APP_AFTER" "$NIGHTLY_TAG" "$NIGHTLY_OID" "$NIGHTLY_VERSION" \
            > "$RUNNER_TEMP/situations-definition-results/revisions.txt"
      - name: Install app dependencies
        shell: bash
        run: |
          set -euo pipefail
          for label in baseline candidate; do
            cd "$GITHUB_WORKSPACE/$label"
            bun install --frozen-lockfile
          done
      - name: Compare exported app functions on fresh homes
        env:
          LASTDBD: ${{ steps.nightly.outputs.lastdbd }}
          NIGHTLY_OID: ${{ steps.nightly.outputs.oid }}
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        run: |
          python3 candidate/scripts/schema-values-latency.py \
            --baseline "$GITHUB_WORKSPACE/baseline" --baseline-revision "$APP_BEFORE" \
            --candidate "$GITHUB_WORKSPACE/candidate" --candidate-revision "$APP_AFTER" \
            --worker "$GITHUB_WORKSPACE/candidate/scripts/schema-values-workload.ts" \
            --daemon "$LASTDBD" --daemon-revision "$NIGHTLY_OID" --daemon-version "$NIGHTLY_VERSION" \
            --lastdb-source "$GITHUB_WORKSPACE/lastdb" --records 64 \
            --output "$RUNNER_TEMP/situations-results"
      - name: Retain definition results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: situations-definitions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/situations-definition-results/
          if-no-files-found: error
          retention-days: 14
      - name: Retain raw measurement samples and source identities
        if: always()
        id: measurements
        uses: actions/upload-artifact@v4
        with:
          name: situations-values-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/situations-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify measurement archive identity, expiry, and checksum
        if: ${{ always() && steps.measurements.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.measurements.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.measurements.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.measurements.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/measurement-metadata.json"
          python3 lastdb/scripts/benchmarks/artifact.py \
            --metadata "$RUNNER_TEMP/measurement-metadata.json" --output "$RUNNER_TEMP/measurement-receipt"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/measurement.zip"
          printf '%s  %s\n' "${ARTIFACT_SHA256#sha256:}" "$RUNNER_TEMP/measurement.zip" | sha256sum --check
          unzip -t "$RUNNER_TEMP/measurement.zip" > /dev/null
  benchmark-complete:
    if: ${{ always() }}
    needs: [compare]
    runs-on: ubuntu-24.04
    steps:
      - name: Require product operations, complete measurements, and verified output
        env:
          RESULT: ${{ needs.compare.result }}
        run: test "$RESULT" = success
