name: F-Situations schema values and latency
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_registry:
        description: "Also verify the signed PROD listing and managed CLI for this exact main commit"
        type: choice
        options: [none, next, stable]
        default: none
permissions:
  contents: read
  actions: read
concurrency:
  group: situations-values-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # The old app is the PR base (the previous main on a push). Main has the
  # admin snapshot pages under the 64 KiB record cap since #28.
  APP_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  APP_AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  compare:
    name: Actual app latency
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APP_AFTER }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.APP_BEFORE }}
          path: baseline
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Fetch verified LastDB releases for both source revisions
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          native='(.schemas | length == 8 and all(.[]; (.record_keys | type) == "object"))'
          jq -e "$native" candidate/lastdb-app.json > /dev/null
          tag="$(gh release list -R EdgeVector/lastdb --exclude-drafts --limit 30 \
            --json tagName,publishedAt --jq '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.publishedAt) | last | .tagName')"
          test -n "$tag" && test "$tag" != null
          fetch() {
            local selected="$1" prefix="$2" dir="$3"
            local archive=lastdb-x86_64-unknown-linux-gnu.tar.gz
            local manifest="$dir/lastdb-x86_64-unknown-linux-gnu.manifest.json"
            local name want oid version sum
            mkdir "$dir"
            gh release download "$selected" -R EdgeVector/lastdb -D "$dir" \
              -p "$archive" -p "$(basename "$manifest")" -p SHA256SUMS.txt
            (cd "$dir" && grep " $archive\$" SHA256SUMS.txt | sha256sum -c -)
            tar -xzf "$dir/$archive" -C "$dir"
            for name in lastdb lastdbd; do
              want="$(jq -er --arg n "$name" '.binaries[] | select(.name == $n) | .sha256' "$manifest")"
              test "$(sha256sum "$dir/$name" | cut -d' ' -f1)" = "$want"
            done
            oid="$(jq -er .source_git_oid "$manifest")"
            version="$(jq -er .version "$manifest")"
            test "${selected##*-}" = "${oid:0:9}"
            sum="$(sha256sum "$dir/$archive" | cut -d' ' -f1)"
            printf '%stag=%s\n%soid=%s\n%sversion=%s\n%slastdbd=%s\n%ssha256=%s\n' \
              "$prefix" "$selected" "$prefix" "$oid" "$prefix" "$version" "$prefix" "$dir/lastdbd" "$prefix" "$sum" >> "$GITHUB_OUTPUT"
            printf 'Nightly %s (source %s), Linux tarball SHA-256 %s.\n\n' "$selected" "$oid" "$sum" >> "$GITHUB_STEP_SUMMARY"
          }
          fetch "$tag" "" "$RUNNER_TEMP/lastdb-nightly"
          if ! jq -e "$native" baseline/lastdb-app.json > /dev/null; then
            # The pre-port app uses the old wire. Keep a real before arm while crossing that boundary.
            fetch nightly-20261104-4b76c7c90 before_ "$RUNNER_TEMP/lastdb-before"
          fi
      # The lastdb helper scripts (scripts/benchmarks, scripts/disk_v2) at the
      # nightly source, so the helper and the daemon stay in step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: EdgeVector/lastdb
          ref: ${{ steps.nightly.outputs.oid }}
          path: lastdb
          persist-credentials: false
      - name: Require the actual source revisions
        env:
          NIGHTLY_OID: ${{ steps.nightly.outputs.oid }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$APP_AFTER"
          test "$(git -C baseline rev-parse HEAD)" = "$APP_BEFORE"
          test "$(git -C lastdb rev-parse HEAD)" = "$NIGHTLY_OID"
          # Registry declarations use the canonical public HTTPS clone URL.
          git -C candidate remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
      - name: Install app dependencies
        shell: bash
        run: |
          set -euo pipefail
          for label in baseline candidate; do
            cd "$GITHUB_WORKSPACE/$label"
            bun install --frozen-lockfile
          done
      - name: Compare exported app functions on fresh homes
        env:
          LASTDBD: ${{ steps.nightly.outputs.lastdbd }}
          NIGHTLY_OID: ${{ steps.nightly.outputs.oid }}
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
          NIGHTLY_SHA256: ${{ steps.nightly.outputs.sha256 }}
          BEFORE_LASTDBD: ${{ steps.nightly.outputs.before_lastdbd || steps.nightly.outputs.lastdbd }}
          BEFORE_OID: ${{ steps.nightly.outputs.before_oid || steps.nightly.outputs.oid }}
          BEFORE_VERSION: ${{ steps.nightly.outputs.before_version || steps.nightly.outputs.version }}
          BEFORE_SHA256: ${{ steps.nightly.outputs.before_sha256 || steps.nightly.outputs.sha256 }}
          VERIFY_REGISTRY: ${{ inputs.verify_registry || 'none' }}
        run: |
          python3 candidate/scripts/schema-values-latency.py \
            --baseline "$GITHUB_WORKSPACE/baseline" --baseline-revision "$APP_BEFORE" \
            --candidate "$GITHUB_WORKSPACE/candidate" --candidate-revision "$APP_AFTER" \
            --worker "$GITHUB_WORKSPACE/candidate/scripts/schema-values-workload.ts" \
            --daemon "$LASTDBD" --daemon-revision "$NIGHTLY_OID" --daemon-version "$NIGHTLY_VERSION" \
            --daemon-archive-sha256 "$NIGHTLY_SHA256" \
            --before-daemon "$BEFORE_LASTDBD" --before-daemon-revision "$BEFORE_OID" \
            --before-daemon-version "$BEFORE_VERSION" --before-daemon-archive-sha256 "$BEFORE_SHA256" \
            --lastdb-source "$GITHUB_WORKSPACE/lastdb" --records 64 \
            --verify-registry "$VERIFY_REGISTRY" \
            --output "$RUNNER_TEMP/situations-results"
      - name: Retain definition results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: situations-definitions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/situations-results/revisions.txt
          if-no-files-found: error
          retention-days: 14
      - name: Retain raw measurement samples and source identities
        if: always()
        id: measurements
        uses: actions/upload-artifact@v4
        with:
          name: situations-values-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/situations-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify measurement archive identity, expiry, and checksum
        if: ${{ always() && steps.measurements.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.measurements.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.measurements.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.measurements.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          # The artifacts API can answer 404 for a second after the upload.
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/measurement-metadata.json" && break
            test "$attempt" -lt 6
            sleep 5
          done
          python3 lastdb/scripts/benchmarks/artifact.py \
            --metadata "$RUNNER_TEMP/measurement-metadata.json" --output "$RUNNER_TEMP/measurement-receipt"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/measurement.zip"
          printf '%s  %s\n' "${ARTIFACT_SHA256#sha256:}" "$RUNNER_TEMP/measurement.zip" | sha256sum --check
          unzip -t "$RUNNER_TEMP/measurement.zip" > /dev/null
  benchmark-complete:
    if: ${{ always() }}
    needs: [compare]
    runs-on: ubuntu-24.04
    steps:
      - name: Require product operations, complete measurements, and verified output
        env:
          RESULT: ${{ needs.compare.result }}
        run: test "$RESULT" = success
